# iTantra — Bitbucket Pipelines CI/CD
# Docs: https://support.atlassian.com/bitbucket-cloud/docs/

image: ghcr.io/cirruslabs/flutter:stable

definitions:
  caches:
    pub-cache: $HOME/.pub-cache
  steps:
    - step: &flutter-test
        name: Test & Analyze
        caches:
          - pub-cache
        script:
          - cd mobile
          - flutter pub get
          - flutter analyze --no-pub
          - flutter test --no-pub

    - step: &flutter-build-apk
        name: Build Android APK
        caches:
          - pub-cache
        script:
          - cd mobile
          - flutter pub get
          - flutter build apk --release --target-platform android-arm64
        artifacts:
          - mobile/build/app/outputs/flutter-apk/*.apk

    - step: &python-lint
        name: Lint Python Scripts
        image: python:3.12
        script:
          - pip install requests
          - python -m py_compile scripts/fetch_models.py
          - python -m py_compile scripts/quantize_models.py
          - python -m py_compile scripts/benchmark_latency.py

pipelines:
  default:
    - step: *flutter-test
    - step: *python-lint

  branches:
    main:
      - step: *flutter-test
      - step: *python-lint
      - step: *flutter-build-apk

  pull-requests:
    "**":
      - step: *flutter-test
      - step: *python-lint
